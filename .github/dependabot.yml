version: 2
updates:
- package-ecosystem: uv
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 2
  ignore:
  - dependency-name: uv-build
    update-types:
    - version-update:semver-patch
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 2
